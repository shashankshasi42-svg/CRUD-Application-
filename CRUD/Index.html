<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRUD Application</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <h1>📋 CRUD Application</h1>
            <p>Create • Read • Update • Delete</p>
        </header>


        <!-- Form Section -->
        <section class="form-section">

            <h2 id="formTitle">Add New Record</h2>

            <form id="crudForm">

                <div class="input-group">
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter name"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="phone">Phone</label>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                        required
                    >
                </div>

                <div class="buttons">

                    <button type="submit" id="submitBtn">
                        ➕ Add Record
                    </button>

                    <button
                        type="button"
                        id="cancelBtn"
                        class="cancel-btn"
                        onclick="cancelEdit()"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </section>


        <!-- Search -->
        <section class="records-section">

            <div class="records-header">

                <h2>📑 Records</h2>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="🔍 Search records..."
                    oninput="searchRecords()"
                >

            </div>


            <!-- Table -->
            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>S.No</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="recordsTable">
                        <!-- Records appear here -->
                    </tbody>

                </table>

            </div>

            <p id="emptyMessage" class="empty-message">
                No records found.
            </p>

        </section>


        <!-- Footer -->
        <footer>
            <p>Web Development Minor Project | CRUD Application</p>
        </footer>

    </div>


    <script src="script.js"></script>

</body>
</html>
